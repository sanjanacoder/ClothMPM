# Evaluation protocol config.
# Run via: python -m src.eval --config configs/eval.yaml --out results/<name>.csv

# Primary eval covers drape and collision. Wind is deferred (a corner-pinned sheet
# under sustained wind has no bounded-strain equilibrium and inverts an element that
# explicit co-rotational MPM cannot integrate through -- see docs/wind-deferral.md).
# It is also a fallback regime for the hybrid, not a target the MPM-surrogate must
# learn. The wind sampler is retained in scripts/generate_dataset.py (--n-wind N).
scenarios:
  drape:
    description: "Cloth dropped onto a sphere of radius 0.2 m centered at (0, 0.4, 0)."
    duration_s: 3.0
    init: "flat_at_y=1.5"
  collision:
    description: "Cloth pinned at top edge; sphere of radius 0.15 m sweeps through it."
    duration_s: 3.0
    sphere_velocity_m_s: 1.0

seeds_eval: [200, 201, 202, 203, 204]   # frozen eval seeds; never used for training
seeds_train: [0, 1, 2, 3, 4, 5, 6, 7]
seeds_val:   [100, 101, 102]

dt_s: 1.0e-3
record_every_n_steps: 5     # 200 Hz logging

metrics:
  per_particle_l2_threshold_m: 0.05   # tau: per-particle position tolerance for rollout horizon
  high_error_label_threshold_m: 0.10  # epsilon for detector positive label y_t = 1[L2(t) > eps]
  rollout_horizons_s: [0.25, 0.5, 1.0, 2.0]

reference: "mpm"             # what we measure neural / hybrid predictions against
